name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment midway; newer pushes queue behind it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check JavaScript syntax
        run: for f in js/*.js; do node --check "$f"; done

      - name: Play a full game in headless Chrome
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 1
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=120000 \
            --dump-dom http://localhost:8000/tests/smoke.html > smoke-dom.html
          grep -oE '(PASS|FAIL) \{[^<]*' smoke-dom.html || cat smoke-dom.html
          grep -q 'data-result="pass"' smoke-dom.html

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html style.css js _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
